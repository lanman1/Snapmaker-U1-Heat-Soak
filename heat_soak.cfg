# Snapmaker U1 Heat Soak v0.3.0 (experimental, hardware testing pending)
# Nonblocking two-second periodic checks; no M190 or G4 dwell.
# Uses [fan_generic cavity_fan], not Top Cover purifier.
# Do not start this while a print is running.
[gcode_macro _HEAT_SOAK_STATE]
variable_active: 0
variable_phase: 0
variable_bed: 0.0
variable_fan: 0.0
variable_remaining: 0
variable_heat_remaining: 0
variable_restore_timeout: 600
gcode:

[gcode_macro HEAT_SOAK]
description: Start nonblocking cavity-fan heat soak
gcode:
    {% set bed = params.BED|default(100)|float %}
    {% set minutes = params.MINUTES|default(30)|int %}
    {% set fan = params.FAN|default(0.4)|float %}
    {% set heat_minutes = params.HEAT_TIMEOUT|default(45)|int %}
    {% set state = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% set old_timeout = printer.configfile.settings.idle_timeout.timeout|default(600)|int %}
    {% if state.active|int != 0 %}
        { action_raise_error("Heat soak already active. Use CANCEL_HEAT_SOAK first.") }
    {% elif printer.print_stats.state|default("standby") == "printing" %}
        { action_raise_error("Do not start heat soak during an active print.") }
    {% elif bed < 1 or bed > 100 %}
        { action_raise_error("BED must be 1-100 C.") }
    {% elif minutes < 1 or minutes > 120 %}
        { action_raise_error("MINUTES must be 1-120.") }
    {% elif fan < 0 or fan > 1 %}
        { action_raise_error("FAN must be 0.0-1.0.") }
    {% elif heat_minutes < 1 or heat_minutes > 120 %}
        { action_raise_error("HEAT_TIMEOUT must be 1-120 minutes.") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=1
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=bed VALUE={bed}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=fan VALUE={fan}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=remaining VALUE={minutes * 30}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=heat_remaining VALUE={heat_minutes * 30}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=restore_timeout VALUE={old_timeout}
        SET_IDLE_TIMEOUT TIMEOUT={(minutes + heat_minutes) * 60 + 900}
        SET_FAN_SPEED FAN=cavity_fan SPEED={fan}
        M140 S{bed}
        RESPOND MSG="Heat soak starting: bed {bed}C, fan {fan*100}%, soak {minutes} min"
        M117 Heat soak heating
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
    {% endif %}

[delayed_gcode _HEAT_SOAK_TICK]
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% set target = printer.heater_bed.target|float %}
    {% set actual = printer.heater_bed.temperature|float %}
    {% if s.active|int == 1 %}
        {% if (target - s.bed|float)|abs > 0.5 %}
            # Manual setpoint changed. Stop soak but preserve new bed target.
            _HEAT_SOAK_STOP KEEP_BED=1 REASON="Bed target changed; heat soak canceled"
        {% elif s.phase|int == 1 %}
            {% if actual >= s.bed|float - 1.0 %}
                SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=2
                RESPOND MSG="Bed ready: timed heat soak begins"
                M117 Heat soaking
                UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
            {% elif s.heat_remaining|int <= 1 %}
                _HEAT_SOAK_STOP KEEP_BED=0 REASON="Bed warmup timed out"
            {% else %}
                SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=heat_remaining VALUE={s.heat_remaining|int - 1}
                UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
            {% endif %}
        {% elif s.phase|int == 2 %}
            {% if s.remaining|int <= 1 %}
                _HEAT_SOAK_COMPLETE
            {% else %}
                SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=remaining VALUE={s.remaining|int - 1}
                UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _HEAT_SOAK_COMPLETE]
description: Finish heat soak; leave bed at requested print temperature
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% set chamber = printer["temperature_sensor cavity"].temperature|float %}
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=0
    SET_FAN_SPEED FAN=cavity_fan SPEED=0
    SET_IDLE_TIMEOUT TIMEOUT={s.restore_timeout|int}
    RESPOND MSG="Heat soak finished; chamber {chamber|round(1)}C. Bed remains heated."
    M117 Heat soak finished

[gcode_macro _HEAT_SOAK_STOP]
description: Internal stop/cleanup routine
gcode:
    {% set keep_bed = params.KEEP_BED|default(0)|int %}
    {% set reason = params.REASON|default("Heat soak stopped") %}
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=0
    SET_FAN_SPEED FAN=cavity_fan SPEED=0
    {% if keep_bed == 0 %}
        M140 S0
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={s.restore_timeout|int}
    RESPOND MSG="{reason}"
    M117 Heat soak stopped

[gcode_macro CANCEL_HEAT_SOAK]
description: Cancel soak now; turn off bed by default
gcode:
    {% set keep_bed = params.KEEP_BED|default(0)|int %}
    {% if keep_bed != 0 and keep_bed != 1 %}
        { action_raise_error("KEEP_BED must be 0 or 1") }
    {% elif printer["gcode_macro _HEAT_SOAK_STATE"].active|int == 0 %}
        RESPOND MSG="No active heat soak"
    {% else %}
        _HEAT_SOAK_STOP KEEP_BED={keep_bed} REASON="Heat soak canceled by user"
    {% endif %}

[gcode_macro HEAT_SOAK_STATUS]
description: Show heat soak phase and approximate remaining time
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% set chamber = printer["temperature_sensor cavity"].temperature|float %}
    {% if s.active|int == 0 %}
        RESPOND MSG="Heat soak inactive. Bed {printer.heater_bed.temperature|round(1)}C, chamber {chamber|round(1)}C"
    {% elif s.phase|int == 1 %}
        RESPOND MSG="Heat soak heating: bed {printer.heater_bed.temperature|round(1)} / {s.bed}C, chamber {chamber|round(1)}C; warmup timeout ~{((s.heat_remaining|int * 2 + 59) // 60)|int} min"
    {% else %}
        RESPOND MSG="Heat soaking: ~{((s.remaining|int * 2 + 59) // 60)|int} min remaining; bed {printer.heater_bed.temperature|round(1)}C; chamber {chamber|round(1)}C"
    {% endif %}
