# Snapmaker U1 heat soak - initial, untested release
# Requires U1 firmware exposing SET_PURIFIER_MODE and "temperature_sensor cavity".
# Keep top cover installed; never leave the printer unattended.
[gcode_macro HEAT_SOAK]
description: Timed ABS/ASA bed and chamber heat soak
gcode:
    {% set bed = params.BED|default(100)|float %}
    {% set minutes = params.MINUTES|default(30)|int %}
    {% set fan = params.FAN|default(0.4)|float %}
    {% if bed < 0 or bed > 100 %}
        { action_raise_error("BED must be between 0 and 100 C") }
    {% elif minutes < 1 or minutes > 120 %}
        { action_raise_error("MINUTES must be 1 to 120") }
    {% elif fan < 0.1 or fan > 1.0 %}
        { action_raise_error("FAN must be between 0.1 and 1.0") }
    {% else %}
        # Allow for warm-up plus the bounded soak interval.
        SET_IDLE_TIMEOUT TIMEOUT={minutes * 60 + 3600}
        # Top Cover internal circulation (not the separate cavity_fan).
        SET_PURIFIER_MODE MODE=3 DESIRE_TEMP=45 FAN_SPEED={fan} DELAY_OFF=600
        RESPOND MSG="U1 heat soak: heating bed to {bed} C"
        M190 S{bed}
        RESPOND MSG="U1 heat soak: soaking for {minutes} minutes"
        M117 Heat soaking
        G4 P{minutes * 60000}
        _HEAT_SOAK_FINISH
    {% endif %}

[gcode_macro _HEAT_SOAK_FINISH]
description: Report actual chamber temperature after heat soak
gcode:
    {% set chamber = printer["temperature_sensor cavity"].temperature %}
    RESPOND MSG="U1 heat soak complete. Chamber: {chamber|round(1)} C"
    M117 Heat soak complete
    # Restore standard Klipper idle timeout. Adjust if your normal value differs.
    SET_IDLE_TIMEOUT TIMEOUT=600
