# Snapmaker U1 heat soak v0.4.0 — EXPERIMENTAL / hardware validation pending
# Requires [fan_generic cavity_fan], [temperature_sensor cavity],
# [pause_resume], [virtual_sdcard], and [respond].
# Manual heat soak runs without G4/M190 and can be canceled.
# Print gate uses native PAUSE/RESUME; validate on the exact U1 firmware.

[gcode_macro _HEAT_SOAK_STATE]
variable_active: 0
variable_phase: 0
variable_bed: 0.0
variable_fan: 0.0
variable_chamber: 0.0
variable_stabilize_ticks: 0
variable_stable_left: 0
variable_soak_left: 0
variable_total_left: 0
variable_waiting_print: 0
variable_failed: 0
variable_restore_timeout: 600
gcode:

[gcode_macro HEAT_SOAK]
description: Start nonblocking timed or chamber-target heat soak
gcode:
    {% set bed = params.BED|default(100)|float %}
    {% set minutes = params.MINUTES|default(30)|int %}
    {% set chamber = params.CHAMBER|default(0)|float %}
    {% set stabilize = params.STABILIZE|default(10)|int %}
    {% set max_time = params.MAX_TIME|default(60)|int %}
    {% set fan = params.FAN|default(0.4)|float %}
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% if s.active|int == 1 %}
        { action_raise_error("Heat soak already active. Cancel it first.") }
    {% elif s.waiting_print|int == 1 %}
        { action_raise_error("Resolve waiting print before starting a new soak.") }
    {% elif printer.print_stats.state|default("standby") in ["printing", "paused"] %}
        { action_raise_error("Start heat soak only when no print is running or paused.") }
    {% elif bed < 1 or bed > 100 %}
        { action_raise_error("BED must be 1-100C.") }
    {% elif fan < 0 or fan > 1 %}
        { action_raise_error("FAN must be 0-1.") }
    {% elif chamber < 0 or chamber > 50 %}
        { action_raise_error("CHAMBER must be 0 (off) or up to 50C.") }
    {% elif chamber > 0 and chamber < 20 %}
        { action_raise_error("CHAMBER must be 20-50C, or 0 to disable.") }
    {% elif minutes < 1 or minutes > 120 %}
        { action_raise_error("MINUTES must be 1-120.") }
    {% elif stabilize < 0 or stabilize > 60 %}
        { action_raise_error("STABILIZE must be 0-60 minutes.") }
    {% elif max_time < 1 or max_time > 180 %}
        { action_raise_error("MAX_TIME must be 1-180 minutes.") }
    {% else %}
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=0
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=1
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=bed VALUE={bed}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=fan VALUE={fan}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=chamber VALUE={chamber}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=stabilize_ticks VALUE={stabilize * 30}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=stable_left VALUE={stabilize * 30}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=soak_left VALUE={minutes * 30}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=total_left VALUE={max_time * 30}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=failed VALUE=0
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=restore_timeout VALUE={printer.configfile.settings.idle_timeout.timeout|default(600)|int}
        SET_IDLE_TIMEOUT TIMEOUT={max_time * 60 + 900}
        SET_FAN_SPEED FAN=cavity_fan SPEED={fan}
        M140 S{bed}
        RESPOND MSG="Heat soak started: bed {bed}C; chamber target {chamber}C (0=timed)"
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
    {% endif %}

[delayed_gcode _HEAT_SOAK_TICK]
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% set target = printer.heater_bed.target|float %}
    {% set bed_now = printer.heater_bed.temperature|float %}
    {% set cavity = printer["temperature_sensor cavity"].temperature|float %}
    {% if s.active|int == 1 %}
        {% if (target - s.bed|float)|abs > 0.5 %}
            _HEAT_SOAK_STOP KEEP_BED=1 REASON="Bed setpoint changed; soak canceled"
        {% elif s.total_left|int <= 1 %}
            _HEAT_SOAK_STOP KEEP_BED=0 FAILED=1 REASON="Heat soak maximum time exceeded; waiting print held"
        {% elif s.phase|int == 1 %}
            SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=total_left VALUE={s.total_left|int - 1}
            {% if bed_now >= s.bed|float - 1 %}
                SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=2
                RESPOND MSG="Bed reached target; soak monitoring started"
            {% endif %}
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
        {% elif s.chamber|float > 0 %}
            SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=total_left VALUE={s.total_left|int - 1}
            {% if cavity >= s.chamber|float %}
                {% if s.stable_left|int <= 1 %}
                    _HEAT_SOAK_COMPLETE
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=stable_left VALUE={s.stable_left|int - 1}
                    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
                {% endif %}
            {% else %}
                # Require a fresh continuous stabilization period at/above target.
                SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=stable_left VALUE={s.stabilize_ticks|int}
                UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
            {% endif %}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=total_left VALUE={s.total_left|int - 1}
            {% if s.soak_left|int <= 1 %}
                _HEAT_SOAK_COMPLETE
            {% else %}
                SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=soak_left VALUE={s.soak_left|int - 1}
                UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=2
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _HEAT_SOAK_COMPLETE]
description: Finish and optionally release gated print
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% set cavity = printer["temperature_sensor cavity"].temperature|float %}
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=0
    SET_FAN_SPEED FAN=cavity_fan SPEED=0
    SET_IDLE_TIMEOUT TIMEOUT={s.restore_timeout|int}
    RESPOND MSG="Heat soak complete: chamber {cavity|round(1)}C; bed kept heated"
    {% if s.waiting_print|int == 1 %}
        # Run separately to read refreshed state and verify pause is still active.
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_RELEASE DURATION=1
    {% endif %}

[delayed_gcode _HEAT_SOAK_RELEASE]
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% if s.waiting_print|int == 1 and s.active|int == 0 and s.failed|int == 0 %}
        {% if printer.pause_resume.is_paused and printer.print_stats.state|default("standby") == "paused" %}
            SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=waiting_print VALUE=0
            RESPOND MSG="Heat soak ready: resuming paused print"
            RESUME
        {% else %}
            RESPOND MSG="Cannot auto-resume: print is not paused. Manual inspection required."
        {% endif %}
    {% endif %}

[gcode_macro HEAT_SOAK_PRINT_GATE]
description: Put submitted print on hold if an active soak is in progress
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% if s.active|int == 1 %}
        {% if s.waiting_print|int == 1 %}
            { action_raise_error("Another print is already waiting for heat soak.") }
        {% else %}
            SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=waiting_print VALUE=1
            RESPOND MSG="Print waiting for heat soak completion"
            PAUSE
        {% endif %}
    {% elif s.failed|int == 1 or s.waiting_print|int == 1 %}
        { action_raise_error("Prior heat soak failed or a print is held. Resolve before printing.") }
    {% endif %}

[gcode_macro _HEAT_SOAK_STOP]
description: Internal cancel/timeout cleanup
gcode:
    {% set keep_bed = params.KEEP_BED|default(0)|int %}
    {% set failed = params.FAILED|default(0)|int %}
    {% set reason = params.REASON|default("Heat soak stopped") %}
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=0
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_RELEASE DURATION=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=phase VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=failed VALUE={failed}
    SET_FAN_SPEED FAN=cavity_fan SPEED=0
    {% if keep_bed == 0 %}
        M140 S0
    {% endif %}
    SET_IDLE_TIMEOUT TIMEOUT={s.restore_timeout|int}
    RESPOND MSG="{reason}"
    {% if s.waiting_print|int == 1 %}
        RESPOND MSG="Queued print remains paused. Cancel the PRINT from the U1 interface; do not use RESUME unless safe."
    {% endif %}

[gcode_macro CANCEL_HEAT_SOAK]
description: Cancel soak; bed off unless KEEP_BED=1
gcode:
    {% set keep = params.KEEP_BED|default(0)|int %}
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% if keep != 0 and keep != 1 %}
        { action_raise_error("KEEP_BED must be 0 or 1.") }
    {% elif s.active|int == 1 %}
        _HEAT_SOAK_STOP KEEP_BED={keep} FAILED=1 REASON="Heat soak canceled"
    {% else %}
        RESPOND MSG="No heat soak active; an existing paused print must be handled separately"
    {% endif %}

[gcode_macro HEAT_SOAK_STATUS]
description: Display heat soak phase, temperatures, and print gate
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% set cavity = printer["temperature_sensor cavity"].temperature|float %}
    RESPOND MSG="Soak active={s.active}; phase={s.phase}; bed={printer.heater_bed.temperature|round(1)}/{printer.heater_bed.target|round(1)}C; cavity={cavity|round(1)}C; chamber target={s.chamber}C; maximum remaining ~{(s.total_left|int * 2 / 60)|round(1)}min; soak ticks left={s.soak_left}; stabilization ticks left={s.stable_left}; print waiting={s.waiting_print}; failed={s.failed}"

[gcode_macro HEAT_SOAK_CLEAR]
description: Clear stale print gate after print canceled and soak ended
gcode:
    {% set s = printer["gcode_macro _HEAT_SOAK_STATE"] %}
    {% if s.active|int == 1 %}
        { action_raise_error("Cancel active heat soak first.") }
    {% elif printer.print_stats.state|default("standby") in ["printing", "paused"] or printer.pause_resume.is_paused %}
        { action_raise_error("Cancel/finish the print before clearing the gate.") }
    {% else %}
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_RELEASE DURATION=0
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=waiting_print VALUE=0
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=failed VALUE=0
        RESPOND MSG="Heat soak gate cleared"
    {% endif %}
