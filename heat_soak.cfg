# Snapmaker U1 heat soak (experimental, hardware validation pending).
# Uses the cavity/curtain air fan; does NOT use the Top Cover purifier.
# Keep enclosure fitted and supervise initial tests.
[gcode_macro HEAT_SOAK]
description: Timed ABS/ASA heat soak with cavity/curtain fan
gcode:
    {% set bed = params.BED|default(100)|float %}
    {% set minutes = params.MINUTES|default(30)|int %}
    {% set fan = params.FAN|default(0.4)|float %}
    {% if bed < 0 or bed > 100 %}
        { action_raise_error("BED must be between 0 and 100 C") }
    {% elif minutes < 1 or minutes > 120 %}
        { action_raise_error("MINUTES must be 1 to 120") }
    {% elif fan < 0 or fan > 1.0 %}
        { action_raise_error("FAN must be between 0 and 1.0") }
    {% else %}
        # Allow for heat-up plus timed soak.
        SET_IDLE_TIMEOUT TIMEOUT={minutes * 60 + 3600}
        # Snapmaker U1 auxiliary cavity/curtain air fan.
        SET_FAN_SPEED FAN=cavity_fan SPEED={fan}
        RESPOND MSG="U1 heat soak: heating bed to {bed} C; cavity fan {fan*100|round(0)}%"
        M190 S{bed}
        RESPOND MSG="U1 heat soak: soaking for {minutes} minutes"
        M117 Heat soaking
        G4 P{minutes * 60000}
        _HEAT_SOAK_FINISH
    {% endif %}

[gcode_macro _HEAT_SOAK_FINISH]
description: Finish soak, stop cavity fan, report chamber temperature
gcode:
    {% set chamber = printer["temperature_sensor cavity"].temperature %}
    SET_FAN_SPEED FAN=cavity_fan SPEED=0
    RESPOND MSG="U1 heat soak complete. Chamber: {chamber|round(1)} C"
    M117 Heat soak complete
    # Adjust to match your printer's normal timeout setting.
    SET_IDLE_TIMEOUT TIMEOUT=600
